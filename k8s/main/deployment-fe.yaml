apiVersion: apps/v1
kind: Deployment
metadata:
  name: biatec-scan-fe-app-deployment
  namespace: biatec-scan
spec:
  selector:
    matchLabels:
      app: biatec-scan-fe-app
  replicas: 1
  template:
    metadata:
      labels:
        app: biatec-scan-fe-app
    spec:
      containers:
        - name: biatec-scan-fe-app
          image: scholtz2/biatec-scan-fe:mainnet-1.2025.09.28-main
          imagePullPolicy: Always
          env:
            # Only the CSP header is set at runtime; the API/algod/indexer
            # URLs themselves are VITE_* build-time values baked into this
            # image's JS bundle by the mainnet build - see
            # .github/workflows/build-fe.yml. Keep this in sync with those
            # build args whenever either changes.
            - name: CSP_CONNECT_SRC
              value: >-
                https://api.algorand.scan.biatec.io
                wss://api.algorand.scan.biatec.io
                https://algorand-algod-public.de-4.biatec.io
                https://mainnet-idx.4160.nodely.dev
                https://mainnet-idx.voi.nodely.dev
                https://algorand.scan.biatec.io
          resources:
            requests:
              cpu: 200m
              memory: "200Mi"
            limits:
              cpu: 2000m
              memory: "1000Mi"
          ports:
            - containerPort: 8080
              protocol: TCP
          # /health is a static 200 served by nginx itself (docker/default.conf.template,
          # access_log off) - also used by the external uptime monitor.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            timeoutSeconds: 5
            failureThreshold: 2
            terminationGracePeriodSeconds: 1
          volumeMounts:
            - name: biatec-scan-fe-main-conf
              mountPath: /app/appsettings.json
              subPath: appsettings.json
      volumes:
        - name: biatec-scan-fe-main-conf
          configMap:
            name: biatec-scan-fe-main-conf
---
apiVersion: v1
kind: Service
metadata:
  name: biatec-scan-fe-service
  namespace: biatec-scan
spec:
  type: ClusterIP
  selector:
    app: biatec-scan-fe-app
  ports:
    - name: http
      protocol: TCP
      appProtocol: http
      port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biatec-scan-algorand-ingress-main
  namespace: biatec-scan
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - algorand.scan.biatec.io
      secretName: tls-algorand.scan.biatec.io
  rules:
    - host: algorand.scan.biatec.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: biatec-scan-fe-service
                port:
                  number: 8080

          # biatec-charts-service (the TradingView chart microservice) is
          # defined in k8s/main/deployment-charts.yaml (image: the moving
          # `production` tag, promoted manually in the biatec-charting-widget
          # repo) and applied + restarted by this repo's deploy-production
          # job. Testnet runs the `stage` tag via k8s/testnet.
          - path: /charts
            pathType: Prefix
            backend:
              service:
                name: biatec-charts-service
                port:
                  number: 80
