# Production deployment of the TradingView charting widget, serving
# https://algorand.scan.biatec.io/charts/ (the /charts Ingress path in
# deployment-fe.yaml routes to the Service below).
#
# The image is built by the biatec-charting-widget repo: its build.yml pushes
# every main-branch build as `stage`, and its manual promote-production.yml
# re-tags a stage-verified version as the moving `production` tag used here.
# This manifest is applied (and the deployment restarted, so the Always pull
# policy fetches the newest `production` image) by this repo's
# deploy-production job in .github/workflows/promote-production.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biatec-charts-deployment
  namespace: biatec-scan
spec:
  selector:
    matchLabels:
      app: biatec-charts
  replicas: 1
  template:
    metadata:
      labels:
        app: biatec-charts
    spec:
      # regcred is created/refreshed by the deploy-production job in
      # .github/workflows/promote-production.yml from the PRIVATE_REGISTRY_*
      # secrets - harbor.de-4.biatec.io is a private registry.
      imagePullSecrets:
        - name: regcred
      containers:
        - name: biatec-charts
          image: harbor.de-4.biatec.io/biatec/biatec-charting-widget:production
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: "50Mi"
            limits:
              cpu: 500m
              memory: "200Mi"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
---
# Takes over the pre-existing manually created biatec-charts-service in this
# namespace: applying this updates its selector to point at the Deployment
# above. Any older manually created charts Deployment becomes unused and can
# be deleted once this is live.
apiVersion: v1
kind: Service
metadata:
  name: biatec-charts-service
  namespace: biatec-scan
spec:
  type: ClusterIP
  selector:
    app: biatec-charts
  ports:
    - name: http
      protocol: TCP
      appProtocol: http
      port: 80
      targetPort: 80
