name: Promote to Production

# Manual-only pipeline. Run this once a version has been built by "CI/CD -
# Biatec Scan" (build-fe.yml) and verified on Stage. It re-tags that
# version's already-pushed mainnet image as "latest" in both registries and
# deploys it to production - it never builds a new image itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version string to promote, exactly as produced by the "version"
          job in build-fe.yml (e.g. 1.2026.08.07-a1b2c3d). Find it in the
          build/deploy-stage logs for the run you want to promote. Leave
          empty to promote the newest build currently on Stage (looked up
          in Docker Hub).
        required: false
        default: ""
        type: string

env:
  DOCKERHUB_IMAGE: scholtz2/biatec-scan-fe
  PRIVATE_REGISTRY: harbor.de-4.biatec.io
  PRIVATE_IMAGE: harbor.de-4.biatec.io/biatec/biatec-scan-fe

jobs:
  # ---------------------------------------------------------------------
  # Stage 0: resolve-version - uses the supplied version as-is, or, when
  # none was given, finds the newest versioned image in Docker Hub. Every
  # build-fe.yml run pushes mainnet-<version> and testnet-<version> (the
  # Stage image) with the same version string, so the newest mainnet-*
  # versioned tag is exactly the version currently on Stage.
  # ---------------------------------------------------------------------
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version to promote
        id: resolve
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            echo "No version supplied - looking up the newest stage build in Docker Hub"
            version=$(curl -fsSL "https://hub.docker.com/v2/repositories/${DOCKERHUB_IMAGE}/tags?page_size=100&ordering=last_updated" \
              | jq -r '.results[].name' \
              | grep -E '^mainnet-1\.' \
              | grep -vx 'mainnet-latest' \
              | head -n 1 \
              | sed 's/^mainnet-//')
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not resolve a version to promote (no versioned mainnet-* tag found in Docker Hub)"
            exit 1
          fi
          echo "Promoting version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Stage 1: promote-tag - re-tags the already-built & pushed
  # mainnet-<version> image as mainnet-latest in both registries. Doesn't
  # rebuild anything - just moves the "latest" pointer.
  # ---------------------------------------------------------------------
  promote-tag:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRIVATE_REGISTRY }}
          username: ${{ secrets.PRIVATE_REGISTRY_USER }}
          password: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}

      - name: Pull versioned image
        run: docker pull ${{ env.DOCKERHUB_IMAGE }}:mainnet-${{ needs.resolve-version.outputs.version }}

      - name: Tag & push mainnet-latest (Docker Hub)
        run: |
          docker tag ${{ env.DOCKERHUB_IMAGE }}:mainnet-${{ needs.resolve-version.outputs.version }} ${{ env.DOCKERHUB_IMAGE }}:mainnet-latest
          docker push ${{ env.DOCKERHUB_IMAGE }}:mainnet-latest

      - name: Tag & push mainnet-latest (Private Registry)
        run: |
          docker tag ${{ env.DOCKERHUB_IMAGE }}:mainnet-${{ needs.resolve-version.outputs.version }} ${{ env.PRIVATE_IMAGE }}:mainnet-latest
          docker push ${{ env.PRIVATE_IMAGE }}:mainnet-latest

  # ---------------------------------------------------------------------
  # Stage 2: deploy-production - only runs once the "Production"
  # environment's protection rules (e.g. required reviewers, configured in
  # the GitHub UI) are satisfied. Deploys the version pinned by the input,
  # not the "latest" tag, so the manifest always records exactly which
  # build is running.
  # ---------------------------------------------------------------------
  deploy-production:
    needs: [resolve-version, promote-tag]
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://algorand.scan.biatec.io
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config

      - name: Update manifest image tag
        run: |
          sed -i "s#image: \\S\+#image: ${{ env.DOCKERHUB_IMAGE }}:mainnet-${{ needs.resolve-version.outputs.version }}#" k8s/main/deployment-fe.yaml
          echo '----- Modified manifest (image lines) -----'
          grep -n 'image:' k8s/main/deployment-fe.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/main/deployment-fe.yaml

      - name: Restart & Verify rollout
        run: |
          kubectl rollout restart deployment/biatec-scan-fe-app-deployment -n biatec-scan
          kubectl rollout status deployment/biatec-scan-fe-app-deployment -n biatec-scan

      # deployment-arc56-registry.yaml isn't built by this pipeline (its image comes
      # from the separate ARC56Registry repo) but still needs to be kept in sync -
      # update-config.sh is manual-only and nothing else applies this manifest, so
      # changes to it (e.g. the refresh CronJob) would otherwise never reach the
      # cluster.
      - name: Apply arc56-registry manifest
        run: |
          kubectl apply -f k8s/main/deployment-arc56-registry.yaml

      # The charting widget image is built and promoted (moving `production`
      # tag) by the biatec-charting-widget repo's workflows; its manifest
      # lives here so all cluster access stays in this repo. The restart
      # makes imagePullPolicy: Always fetch whatever `production` currently
      # points to.
      - name: Deploy charting widget (production)
        run: |
          # harbor.de-4.biatec.io is private - make sure the pull secret the
          # charts Deployment references exists/is current in the namespace.
          kubectl create secret docker-registry regcred \
            --namespace biatec-scan \
            --docker-server=harbor.de-4.biatec.io \
            --docker-username='${{ secrets.PRIVATE_REGISTRY_USER }}' \
            --docker-password='${{ secrets.PRIVATE_REGISTRY_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          # One-time migration: an older (manually created) charts Deployment
          # in this namespace has a different spec.selector than the manifest,
          # and spec.selector is immutable - kubectl apply fails with
          # "field is immutable". Delete the old Deployment first so apply can
          # recreate it with the manifest's selector. (Brief downtime for
          # /charts only, and only when the selector actually differs.)
          existing_selector=$(kubectl get deployment biatec-charts-deployment -n biatec-scan \
            -o jsonpath='{.spec.selector.matchLabels}' --ignore-not-found)
          if [ -n "$existing_selector" ] && [ "$existing_selector" != '{"app":"biatec-charts"}' ]; then
            echo "Existing selector $existing_selector differs from manifest - recreating Deployment"
            kubectl delete deployment biatec-charts-deployment -n biatec-scan
          fi
          kubectl apply -f k8s/main/deployment-charts.yaml
          kubectl rollout restart deployment/biatec-charts-deployment -n biatec-scan
          kubectl rollout status deployment/biatec-charts-deployment -n biatec-scan
