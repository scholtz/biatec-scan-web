name: CI/CD - Biatec Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_IMAGE: scholtz2/biatec-scan-fe
  PRIVATE_REGISTRY: harbor.de-4.biatec.io
  PRIVATE_IMAGE: harbor.de-4.biatec.io/biatec/biatec-scan-fe

jobs:
  # -----------------------------------------------------------------------
  # Stage 1: test - runs on every push and PR, gates everything below.
  # -----------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-typescript-errors-tsc

      - name: Check localization files
        run: pnpm run check-localization-files

      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # -----------------------------------------------------------------------
  # Stage 2: version - one version string shared by every image built in
  # this run, so the same run's build/deploy-stage/deploy-production jobs
  # all agree on which tag they're pushing/deploying.
  # -----------------------------------------------------------------------
  version:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Generate version
        id: vars
        run: |
          DATE=$(date +'%Y.%m.%d')
          echo "version=1.$DATE-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------------
  # Stage 3: build - builds one image per network, each with its own
  # network-specific VITE_* build args baked in (Vite only reads env vars at
  # build time), and pushes to Docker Hub + the private registry. Adding a
  # future network (voi, aramid, ...) is a new matrix entry here plus a new
  # k8s/<network> manifest - no other workflow changes needed.
  # -----------------------------------------------------------------------
  build:
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - network: mainnet
            vite_api_base_url: https://api.algorand.scan.biatec.io
            vite_algorand_algod_url: https://algorand-algod-public.de-4.biatec.io
            vite_algorand_indexer_url: https://mainnet-idx.4160.nodely.dev
            vite_arc56_registry_url: https://algorand.scan.biatec.io/arc56-registry
          - network: testnet
            vite_api_base_url: https://api.testnet.scan.biatec.io
            vite_algorand_algod_url: https://testnet-api.4160.nodely.dev
            vite_algorand_indexer_url: https://testnet-idx.4160.nodely.dev
            vite_arc56_registry_url: https://algorand.scan.biatec.io/arc56-registry
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRIVATE_REGISTRY }}
          username: ${{ secrets.PRIVATE_REGISTRY_USER }}
          password: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}

      - name: Build & Push ${{ matrix.network }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ matrix.network }}
          cache-to: type=gha,mode=max,scope=${{ matrix.network }}
          build-args: |
            VITE_API_BASE_URL=${{ matrix.vite_api_base_url }}
            VITE_ALGORAND_ALGOD_URL=${{ matrix.vite_algorand_algod_url }}
            VITE_ALGORAND_INDEXER_URL=${{ matrix.vite_algorand_indexer_url }}
            VITE_ARC56_REGISTRY_URL=${{ matrix.vite_arc56_registry_url }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ matrix.network }}-${{ needs.version.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ matrix.network }}-latest
            ${{ env.PRIVATE_IMAGE }}:${{ matrix.network }}-${{ needs.version.outputs.version }}
            ${{ env.PRIVATE_IMAGE }}:${{ matrix.network }}-latest

  # -----------------------------------------------------------------------
  # Stage 4: deploy-stage - deploys the testnet image to testnet.scan.biatec.io.
  # Uses the GitHub "Stage" environment so its secrets/protection rules can
  # differ from Production (Settings > Environments > Stage in the repo).
  # -----------------------------------------------------------------------
  deploy-stage:
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: Stage
      url: https://testnet.scan.biatec.io
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config

      - name: Update manifest image tag
        run: |
          sed -i "s#image: \\S\+#image: ${{ env.DOCKERHUB_IMAGE }}:testnet-${{ needs.version.outputs.version }}#" k8s/testnet/deployment-fe.yaml
          echo '----- Modified manifest (image lines) -----'
          grep -n 'image:' k8s/testnet/deployment-fe.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/testnet/deployment-fe.yaml

      - name: Restart & Verify rollout
        run: |
          kubectl rollout restart deployment/biatec-scan-fe-testnet-app-deployment -n biatec-scan-testnet
          kubectl rollout status deployment/biatec-scan-fe-testnet-app-deployment -n biatec-scan-testnet

      # The charting widget image is built by the biatec-charting-widget repo
      # (moving `stage` tag); its manifest lives here so all cluster access
      # stays in this repo. The restart makes imagePullPolicy: Always fetch
      # whatever `stage` currently points to.
      - name: Deploy charting widget (stage)
        run: |
          # harbor.de-4.biatec.io is private - make sure the pull secret the
          # charts Deployment references exists/is current in the namespace.
          kubectl create secret docker-registry regcred \
            --namespace biatec-scan-testnet \
            --docker-server=harbor.de-4.biatec.io \
            --docker-username='${{ secrets.PRIVATE_REGISTRY_USER }}' \
            --docker-password='${{ secrets.PRIVATE_REGISTRY_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          # One-time migration: the testnet charts service used to be an
          # ExternalName alias to the mainnet namespace; kubectl apply can't
          # always convert ExternalName -> ClusterIP in place, so drop the
          # alias first if it's still there.
          if [ "$(kubectl get svc biatec-charts-service -n biatec-scan-testnet -o jsonpath='{.spec.type}' --ignore-not-found)" = "ExternalName" ]; then
            echo "Removing legacy ExternalName biatec-charts-service"
            kubectl delete svc biatec-charts-service -n biatec-scan-testnet
          fi
          kubectl apply -f k8s/testnet/deployment-charts.yaml
          kubectl rollout restart deployment/biatec-charts-stage-deployment -n biatec-scan-testnet
          kubectl rollout status deployment/biatec-charts-stage-deployment -n biatec-scan-testnet

  # Production is no longer deployed automatically from this flow - promoting
  # a build to production is a manual, separate action. See
  # .github/workflows/promote-production.yml, which is triggered by hand once
  # a version has been verified on Stage.
